{% extends "base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
    <section class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-xl shadow-black/10">
        <div class="mb-6 flex items-start justify-between gap-4">
            <div>
                <h1 class="text-2xl font-semibold">Edit expense</h1>
                <p class="mt-1 text-sm text-slate-400">Update the transaction and save your changes.</p>
            </div>
            <a href="{{ url_for('index') }}" class="text-sm text-sky-300 hover:text-sky-200">Back</a>
        </div>

        <form action="{{ url_for('edit_expense', expense_id=expense.id) }}" method="post" class="space-y-5">
            <div>
                <label for="description" class="mb-1 block text-sm text-slate-300">Description</label>
                <input id="description" name="description" type="text" maxlength="120" required
                       value="{{ expense.description }}"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-sky-500">
            </div>

            <div>
                <label for="amount" class="mb-1 block text-sm text-slate-300">Amount (£)</label>
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" required
                       value="{{ '%.2f'|format(expense.amount) }}"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-sky-500">
            </div>

            <div>
                <label for="date" class="mb-1 block text-sm text-slate-300">Date</label>
                <input id="date" name="date" type="date" required
                       value="{{ expense.date.isoformat() if expense.date else today }}"
                       class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-sky-500">
            </div>

            <div>
                <label for="category" class="mb-1 block text-sm text-slate-300">Category</label>
                <select id="category" name="category" required
                        class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-sky-500">
                    {% for category in categories %}
                        <option value="{{ category }}" {% if expense.category == category %}selected{% endif %}>
                            {{ category }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                <a href="{{ url_for('index') }}"
                   class="rounded-lg border border-slate-700 px-4 py-2 text-center font-medium hover:bg-slate-800">
                    Cancel
                </a>
                <button type="submit"
                        class="rounded-lg bg-sky-500 px-4 py-2 font-semibold text-slate-950 hover:bg-sky-400">
                    Save changes
                </button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
